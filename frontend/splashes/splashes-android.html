<!DOCTYPE html>
<html lang="mr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
  <meta name="theme-color" content="#0b1c3d">
  <meta name="description" content="LalPari.Live - Official MSRTC Bus Tracking Splash Screen">
  <title>LalPari.Live - Splash Screen</title>
  
  <link rel="apple-touch-icon" sizes="152x152" href="../../assets/images/splash-background.jpeg">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0b1c3d;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .splash-shell {
      height: 100vh;
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-image: url('../../assets/images/splash-background.jpeg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: opacity 0.5s ease-out;
    }

    .fade-out {
      opacity: 0;
    }

    @media (min-width: 768px) {
      body {
        background: #040914;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .splash-shell {
        width: 100%;
        max-width: 520px;
        height: 100vh;
        max-height: 980px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }
    }
  </style>
</head>
<body>

  <div class="splash-shell" id="splashScreen">
    <!-- स्प्लॅश स्क्रीन कंटेंट (इमेज बॅकग्राउंड म्हणून सेट केली आहे) -->
  </div>

  <script>
    const LOADING_DURATION = 4000; // ४ सेकंद स्प्लॅश स्क्रीन दाखवेल

    // ३.५ सेकंदांनंतर स्प्लॅश स्क्रीन हळूहळू हायड (Fade Out) होईल
    setTimeout(() => {
      const splash = document.getElementById('splashScreen');
      if (splash) {
        splash.classList.add('fade-out');
      }
    }, LOADING_DURATION - 500);

    // ४ सेकंदांनंतर होम/मुख्य पानावर (index.html) घेऊन जाईल
    setTimeout(() => {
      window.location.href = '../index.html'; // तुमच्या मुख्य पेजचा अचूक पाथ इथे टाका
    }, LOADING_DURATION);
  </script>

</body>
</html>
