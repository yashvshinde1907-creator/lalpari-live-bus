<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LALPARI-LIVE-Loading</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #121212;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden;
        }
        .logo-container {
            position: relative;
            margin-bottom: 32px;
        }
        .logo-ring {
            width: 100px;
            height: 100px;
            border-radius: 28px;
            background: linear-gradient(135deg, #3DDC84, #00C853);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            animation: pulse 2s ease-in-out infinite;
            box-shadow: 0 0 50px rgba(61, 220, 132, 0.3);
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .app-name {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 8px;
        }
        .tagline {
            font-size: 13px;
            color: #aaaaaa;
            margin-bottom: 32px;
        }
        .loader-bar {
            width: 160px;
            height: 3px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }
        .loader-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3DDC84, #00C853);
            border-radius: 2px;
            animation: fillBar 2.2s ease-out forwards;
        }
        @keyframes fillBar {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        .loading-text {
            margin-top: 16px;
            font-size: 11px;
            color: #666666;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <div class="logo-ring">🤖</div>
    </div>
    <div class="app-name">Universal PWA</div>
    <div class="tagline">Android Optimized</div>
    <div class="loader-bar">
        <div class="loader-fill"></div>
    </div>
    <div class="loading-text">Optimizing for Android...</div>
