<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Universal PWA - Loading</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000000;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            overflow: hidden;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .logo-container {
            position: relative;
            margin-bottom: 32px;
        }
        .logo-ring {
            width: 100px;
            height: 100px;
            border-radius: 24px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            animation: pulse 2s ease-in-out infinite;
            box-shadow: 0 0 50px rgba(99, 102, 241, 0.3);
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .app-name {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
            letter-spacing: -0.3px;
        }
        .tagline {
            font-size: 13px;
            color: #8e8e93;
            margin-bottom: 32px;
        }
        .loader-bar {
            width: 160px;
            height: 3px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }
        .loader-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #0a84ff, #5e5ce6);
            border-radius: 2px;
            animation: fillBar 2.2s ease-out forwards;
        }
        @keyframes fillBar {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        .loading-text {
            margin-top: 16px;
            font-size: 11px;
            color: #636366;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <div class="logo-ring">🍎</div>
    </div>
    <div class="app-name">Universal PWA</div>
    <div class="tagline">iOS Experience</div>
    <div class="loader-bar">
        <div class="loader-fill"></div>
    </div>
    <div class="loading-text">Launching via Safari Engine...</div>
